name: Web verification

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  foundation:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Verify the runtime and install locked dependencies
        run: |
          node -e "const { engines } = require('./package.json'); if (process.versions.node !== engines.node) process.exit(1)"
          test "$(npm --version)" = "$(node -p "require('./package.json').engines.npm")"
          npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npm exec -- playwright install --with-deps chromium
      - run: npm run test:e2e
      - id: design
        run: npm run test:design
      - name: Upload synthetic design screenshots
        if: ${{ !cancelled() && (steps.design.outcome == 'success' || steps.design.outcome == 'failure') }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: w0-design-screenshots
          path: test-results/design/**/*.png
          if-no-files-found: error
          retention-days: 14
